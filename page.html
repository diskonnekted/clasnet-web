<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman — Clasnet Group</title>
  <meta name="description" content="Halaman Clasnet Group.">
  <meta name="theme-color" content="#0f62fe">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <script src="js/content.js"></script>
  <script src="js/layout.js"></script>
</head>
<body data-page="">

  <div id="site-header"></div>
  <script>
    var __slug = new URLSearchParams(location.search).get('slug') || '';
    document.body.setAttribute('data-page', __slug);
    document.getElementById('site-header').innerHTML = ClasnetLayout.header(__slug);
  </script>

  <main id="pageRoot">
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Beranda</a><span class="sep">/</span><span class="current" id="crumbTitle">Halaman</span></nav>
        <h1 class="display-md" id="pageTitle">Memuat…</h1>
        <p class="lead" id="pageLead" hidden></p>
      </div>
    </section>
    <section class="section">
      <div class="container page-body" id="pageBody"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script>document.getElementById('site-footer').innerHTML = ClasnetLayout.footer();</script>

  <script src="js/pages.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get('slug') || '';
      var pages = window.CLASNET_PAGES || [];
      var p = null;
      for (var i = 0; i < pages.length; i++) { if (pages[i].slug === slug) { p = pages[i]; break; } }

      var titleEl = document.getElementById('pageTitle');
      var crumbEl = document.getElementById('crumbTitle');
      var bodyEl = document.getElementById('pageBody');

      if (!p) {
        document.title = 'Halaman tidak ditemukan — Clasnet Group';
        titleEl.textContent = 'Halaman tidak ditemukan';
        crumbEl.textContent = 'Tidak ditemukan';
        bodyEl.innerHTML = '<p class="lead">Halaman yang Anda cari tidak tersedia. <a href="index.html">Kembali ke Beranda</a>.</p>';
        return;
      }
      document.title = (p.title || 'Halaman') + ' — Clasnet Group';
      var md = document.querySelector('meta[name="description"]');
      if (md && p.metaDescription) md.setAttribute('content', p.metaDescription);
      titleEl.textContent = p.title || 'Halaman';
      crumbEl.textContent = p.navLabel || p.title || 'Halaman';
      bodyEl.innerHTML = p.bodyHtml || '<p class="lead">Konten halaman ini belum diisi. Sunting lewat Dasbor CMS.</p>';
    })();
  </script>
</body>
</html>
